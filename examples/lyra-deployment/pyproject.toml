[project]
name = "lyra-deployment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["lyra-app", "lyra-sdk", "lyra-utils", "lyra-smoke-plugin"]

[tool.uv]
package = false

# This executable example uses checked-out source. In a deployment repository,
# replace these sources with Git revisions and regenerate this project's lockfile.
[tool.uv.sources]
lyra-app = { path = "../.." }
lyra-sdk = { path = "../../packages/lyra_sdk", editable = true }
lyra-utils = { path = "../../packages/lyra_utils", editable = true }
lyra-smoke-plugin = { path = "../lyra-plugin" }
