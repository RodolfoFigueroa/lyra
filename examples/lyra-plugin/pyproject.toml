[project]
name = "lyra-smoke-plugin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lyra-sdk",
    "pandas>=2.3.3",
]

[tool.lyra]
factory = "smoke_plugin.plugin:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smoke_plugin"]

[tool.hatch.build.targets.wheel.shared-data]
"lyra.plugin.json" = "share/lyra/plugins/lyra-smoke-plugin/lyra.plugin.json"

[tool.hatch.build.targets.sdist]
include = ["smoke_plugin", "lyra.plugin.json", "pyproject.toml"]
