[project]
name = "lyra-sdk"
version = "0.13.1"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
postgres = [
    "geopandas>=1.1.3",
    "psycopg[binary]>=3.3.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
lyra-plugin = "lyra.sdk.plugin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyra"]
